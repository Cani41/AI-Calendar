name: Deploy Preview to Vercel

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Preview
        run: npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | tee deploy-url.txt
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Print Preview URL
        run: |
          cat deploy-url.txt | sed 's/\x1b\[[0-9;]*m//g' | grep -o 'https://[^ ]*\.vercel\.app' | head -1
